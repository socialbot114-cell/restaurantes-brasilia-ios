name: Restaurantes Brasília photo visual review
run-name: Visual review of restaurant photos · ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    paths:
      - "Resources/Assets.xcassets/**"
      - "Resources/Catalog/catalog.json"
      - "Sources/ContentView.swift"
      - "Sources/RestaurantModels.swift"
      - "project.yml"
      - "UITests/PhotoVisualReviewUITests.swift"
      - "tools/*photo*.py"
      - ".github/workflows/photo-visual-review.yml"
  pull_request:
    paths:
      - "Resources/Assets.xcassets/**"
      - "Resources/Catalog/catalog.json"
      - "Sources/ContentView.swift"
      - "Sources/RestaurantModels.swift"
      - "project.yml"
      - "UITests/PhotoVisualReviewUITests.swift"
      - "tools/*photo*.py"
      - ".github/workflows/photo-visual-review.yml"

permissions:
  contents: read

jobs:
  visual-review:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device:
          - name: iPhone 17
            slug: iphone
            os: "26.5"
          - name: Available iPad simulator
            slug: ipad
            family: ipad
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install XcodeGen and contact-sheet dependency
        run: |
          brew install xcodegen
          python -m venv "$RUNNER_TEMP/photo-review-venv"
          "$RUNNER_TEMP/photo-review-venv/bin/python" -m pip install --disable-pip-version-check Pillow

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Run photo-focused UI review and capture screens
        run: |
          set -euo pipefail
          if [[ "${{ matrix.device.family }}" == "ipad" ]]; then
            simulator_selection="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          preferred = {"iPad Air 11-inch (M4)": 3, "iPad Air 11-inch (M3)": 2, "iPad (A16)": 1}
          candidates = []
          for runtime, devices in data["devices"].items():
              if ".iOS-" not in runtime:
                  continue
              try:
                  version = tuple(int(part) for part in runtime.rsplit(".iOS-", 1)[1].split("-"))
              except ValueError:
                  version = (0,)
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPad"):
                      candidates.append((version, preferred.get(device["name"], 0), device))
          if not candidates:
              raise SystemExit("No available iPad simulator found.")
          _, _, device = max(candidates, key=lambda item: (item[0], item[1]))
          print(device["udid"] + "\t" + device["name"])
          ')"
            IFS=$'\t' read -r simulator_id simulator_name <<< "$simulator_selection"
            echo "Using available iPad simulator: $simulator_name ($simulator_id)"
            destination="platform=iOS Simulator,id=$simulator_id"
          else
            destination='platform=iOS Simulator,name=${{ matrix.device.name }},OS=${{ matrix.device.os }}'
          fi
          xcodebuild test \
            -project RestaurantesBrasilia.xcodeproj \
            -scheme RestaurantesBrasilia \
            -destination "$destination" \
            -resultBundlePath "$RUNNER_TEMP/photo-review-${{ matrix.device.slug }}.xcresult" \
            -only-testing:RestaurantesBrasiliaUITests/PhotoVisualReviewUITests/testPhotoVisualReview \
            CODE_SIGNING_ALLOWED=NO

      - name: Export UI screenshot attachments
        if: always()
        run: |
          set -euo pipefail
          result_bundle="$RUNNER_TEMP/photo-review-${{ matrix.device.slug }}.xcresult"
          raw_output="$RUNNER_TEMP/photo-review-raw-${{ matrix.device.slug }}"
          mkdir -p "$raw_output"
          if [ -d "$result_bundle" ]; then
            xcrun xcresulttool export attachments \
              --path "$result_bundle" \
              --output-path "$raw_output"
          fi

      - name: Build contact sheets, audit report, and gallery
        if: always()
        run: |
          "$RUNNER_TEMP/photo-review-venv/bin/python" tools/create_photo_review_bundle.py \
            --screenshots-dir "$RUNNER_TEMP/photo-review-raw-${{ matrix.device.slug }}" \
            --output-dir "$RUNNER_TEMP/photo-review-${{ matrix.device.slug }}" \
            --minimum-screenshots 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restaurantes-brasilia-photo-review-${{ matrix.device.slug }}
          path: ${{ runner.temp }}/photo-review-${{ matrix.device.slug }}
          if-no-files-found: error
          retention-days: 14
