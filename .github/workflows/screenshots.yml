name: Restaurantes Brasília screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      matrix:
        device:
          - name: iPhone 17
            slug: iphone
            os: "26.5"
          - name: iPad Air 11-inch (M3)
            slug: ipad-air-11-m3
            os: "26.2"
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Run screenshot UI tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project RestaurantesBrasilia.xcodeproj \
            -scheme RestaurantesBrasilia \
            -destination 'platform=iOS Simulator,name=${{ matrix.device.name }},OS=${{ matrix.device.os }}' \
            -resultBundlePath "$RUNNER_TEMP/restaurantes-${{ matrix.device.slug }}.xcresult" \
            -only-testing:RestaurantesBrasiliaUITests \
            CODE_SIGNING_ALLOWED=NO
      - name: Export PNG attachments
        run: |
          set -euo pipefail
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/restaurantes-${{ matrix.device.slug }}.xcresult" \
            --output-path "$RUNNER_TEMP/restaurantes-screenshots-${{ matrix.device.slug }}"
          find "$RUNNER_TEMP/restaurantes-screenshots-${{ matrix.device.slug }}" -type f -name '*.png' -print
      - uses: actions/upload-artifact@v4
        with:
          name: restaurantes-brasilia-screenshots-${{ matrix.device.slug }}
          path: ${{ runner.temp }}/restaurantes-screenshots-${{ matrix.device.slug }}
