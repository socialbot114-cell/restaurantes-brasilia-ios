name: Restaurantes Brasília screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device:
          - name: iPhone 17
            slug: iphone
            format: iphone
            os: "26.5"
          - name: iPad Pro 13-inch (M5)
            slug: ipad-pro-13
            format: ipad
            os: "26.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install XcodeGen and screenshot dependency
        run: |
          brew install xcodegen
          python -m venv "$RUNNER_TEMP/screenshot-venv"
          "$RUNNER_TEMP/screenshot-venv/bin/python" -m pip install --disable-pip-version-check Pillow
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Run screenshot UI tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project RestaurantesBrasilia.xcodeproj \
            -scheme RestaurantesBrasilia \
            -destination 'platform=iOS Simulator,name=${{ matrix.device.name }},OS=${{ matrix.device.os }}' \
            -resultBundlePath "$RUNNER_TEMP/restaurantes-${{ matrix.device.slug }}.xcresult" \
            -only-testing:RestaurantesBrasiliaUITests \
            CODE_SIGNING_ALLOWED=NO
      - name: Export PNG attachments
        if: always()
        run: |
          set -euo pipefail
          result_bundle="$RUNNER_TEMP/restaurantes-${{ matrix.device.slug }}.xcresult"
          output_path="$RUNNER_TEMP/restaurantes-raw-screenshots-${{ matrix.device.slug }}"
          mkdir -p "$output_path"
          if [ -d "$result_bundle" ]; then
            xcrun xcresulttool export attachments \
              --path "$result_bundle" \
              --output-path "$output_path"
          fi
      - name: Normalize screenshots to App Store dimensions
        if: always()
        run: |
          "$RUNNER_TEMP/screenshot-venv/bin/python" tools/normalize_screenshots.py \
            --input-dir "$RUNNER_TEMP/restaurantes-raw-screenshots-${{ matrix.device.slug }}" \
            --output-dir "$RUNNER_TEMP/restaurantes-screenshots-${{ matrix.device.slug }}" \
            --device "${{ matrix.device.format }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restaurantes-brasilia-screenshots-${{ matrix.device.slug }}
          path: ${{ runner.temp }}/restaurantes-screenshots-${{ matrix.device.slug }}
