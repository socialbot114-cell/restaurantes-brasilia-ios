name: Restaurantes Brasília submit 1.1.0 for App Review

on:
  workflow_dispatch:
    inputs:
      action:
        description: Inspect App Store Connect state or submit version 1.1.0 for review
        required: true
        type: choice
        default: inspect
        options:
          - inspect
          - submit
      screenshots_run_id:
        description: Successful screenshot workflow run with the required iPhone and iPad dimensions
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Require a screenshot workflow run ID when submitting
        if: ${{ inputs.action == 'submit' }}
        env:
          SCREENSHOTS_RUN_ID: ${{ inputs.screenshots_run_id }}
        run: |
          if [ -z "$SCREENSHOTS_RUN_ID" ]; then
            echo "Provide the run ID of a successful screenshots workflow with the required dimensions."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        if: ${{ inputs.action == 'submit' }}
        with:
          name: restaurantes-brasilia-screenshots-iphone
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.screenshots_run_id }}
          path: ${{ runner.temp }}/asc-screenshots-iphone
      - uses: actions/download-artifact@v4
        if: ${{ inputs.action == 'submit' }}
        with:
          name: restaurantes-brasilia-screenshots-ipad-pro-13
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.screenshots_run_id }}
          path: ${{ runner.temp }}/asc-screenshots-ipad
      - name: Install App Store Connect JWT dependency
        run: python -m pip install --disable-pip-version-check 'PyJWT[crypto]' Pillow
      - name: Attach build 1.1.0 (5) and submit for App Review
        run: python tools/submit_app_store_review.py
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APP_STORE_PROCESSING_TIMEOUT_MINUTES: "60"
          ASC_ACTION: ${{ inputs.action }}
          ASC_SCREENSHOT_IPHONE_DIR: ${{ runner.temp }}/asc-screenshots-iphone
          ASC_SCREENSHOT_IPAD_DIR: ${{ runner.temp }}/asc-screenshots-ipad
