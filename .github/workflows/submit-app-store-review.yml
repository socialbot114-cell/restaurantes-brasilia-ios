name: Restaurantes Brasília submit 1.0 for App Review

on:
  workflow_dispatch:
    inputs:
      action:
        description: Inspect App Store Connect state or submit version 1.0 for review
        required: true
        type: choice
        default: inspect
        options:
          - inspect
          - submit
      screenshots_run_id:
        description: Successful GitHub screenshots workflow run to use for the App Store listing
        required: true
        type: string
        default: "36108567704"

permissions:
  actions: read
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        if: ${{ inputs.action == 'submit' }}
        with:
          name: restaurantes-brasilia-screenshots-iphone
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.screenshots_run_id }}
          path: ${{ runner.temp }}/asc-screenshots-iphone
      - uses: actions/download-artifact@v4
        if: ${{ inputs.action == 'submit' }}
        with:
          name: restaurantes-brasilia-screenshots-ipad-air-11-m3
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.screenshots_run_id }}
          path: ${{ runner.temp }}/asc-screenshots-ipad
      - name: Install App Store Connect JWT dependency
        run: python -m pip install --disable-pip-version-check 'PyJWT[crypto]' Pillow
      - name: Attach build 1.0 (3) and submit for App Review
        run: python tools/submit_app_store_review.py
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APP_STORE_PROCESSING_TIMEOUT_MINUTES: "60"
          ASC_ACTION: ${{ inputs.action }}
          ASC_SCREENSHOT_IPHONE_DIR: ${{ runner.temp }}/asc-screenshots-iphone
          ASC_SCREENSHOT_IPAD_DIR: ${{ runner.temp }}/asc-screenshots-ipad
