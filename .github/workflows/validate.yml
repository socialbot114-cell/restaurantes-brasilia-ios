name: Restaurantes Brasília validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install JERV dependencies
        run: python3 -m venv .venv && .venv/bin/pip install --disable-pip-version-check PyYAML
      - name: Validate with JERV
        run: .venv/bin/python tools/jerv_cli.py validate app.yml
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Run tests
        run: |
          if xcrun simctl list devices available | grep -q 'iPhone'; then
            device_id=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')
            xcodebuild test -project RestaurantesBrasilia.xcodeproj -scheme RestaurantesBrasilia -destination "id=$device_id" CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild build-for-testing -project RestaurantesBrasilia.xcodeproj -scheme RestaurantesBrasilia -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
          fi
