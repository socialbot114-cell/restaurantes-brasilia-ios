name: RestaurantesBrasilia
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    PRODUCT_BUNDLE_IDENTIFIER: br.com.restaurantes.bsb
targets:
  RestaurantesBrasilia:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Catalog
        type: folder
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: "RestaurantesBrasilia"
        PRODUCT_MODULE_NAME: RestaurantesBrasilia
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Info.plist
        PRIVACY_MANIFEST_FILE: Resources/PrivacyInfo.xcprivacy
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: 1.0
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - RestaurantesBrasiliaTests
        - RestaurantesBrasiliaUITests
  RestaurantesBrasiliaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: RestaurantesBrasilia
  RestaurantesBrasiliaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: RestaurantesBrasilia
